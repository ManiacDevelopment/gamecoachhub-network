}
</style>
<link rel="stylesheet" href="../assets/network.css">

  <link rel="canonical" href="https://gamecoachhub.com/red-dead-online/search.html">
  <link rel="alternate" hreflang="en" href="https://gamecoachhub.com/red-dead-online/search.html?lang=en">

</head>

<body data-site="rdo">

<h1 style="color:#d9a13d;">Search Guides</h1>

<input
type="text"
id="search"
placeholder="Search guides..."
onkeyup="searchGuides()">

<div id="results"></div>

<script>

const guides = [

{name:'Weapons Guide',link:'weapons.html'},
{name:'Money Guide',link:'money-guide.html'},
{name:'Gold Guide',link:'gold-guide.html'},
{name:'Collector Guide',link:'collector-guide.html'},
{name:'Trader Guide',link:'trader-guide.html'},
{name:'Ability Cards',link:'ability-cards.html'},
{name:'PvP Guide',link:'pvp-guide.html'},
{name:'Beginner Roadmap',link:'beginner-roadmap.html'}

];

function searchGuides(){

const query =
document.getElementById('search')
.value.toLowerCase();

const results =
document.getElementById('results');

results.innerHTML = '';

guides.forEach(guide => {

if(
guide.name.toLowerCase().includes(query)
){

results.innerHTML += `
<div class="result">
<a href="${guide.link}">
${guide.name}
</a>
</div>
`;

}

});

}

</script>

<script src="../assets/network-layout.js" defer></script>
<script src="../assets/network-i18n.js" defer></script>
<script src="../assets/monetization.js" defer></script>
</body>
